apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: muskanyadav1/taskmanager-backend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8085