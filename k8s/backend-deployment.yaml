apiVersion: apps/v1
kind: Deployment

metadata:
  name: task-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: task-service

  template:
    metadata:
      labels:
        app: task-service

    spec:
      containers:
        - name: task-service
          image: muskanyadav1/taskmanager-backend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
