apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: task-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - task-service:8085

      - job_name: analytics-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - analytics-service:8086

      - job_name: notification-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - notification-service:8087
