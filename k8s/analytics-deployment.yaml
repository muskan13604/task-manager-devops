apiVersion: apps/v1
kind: Deployment

metadata:
  name: analytics-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: analytics-service

  template:
    metadata:
      labels:
        app: analytics-service

    spec:
      containers:
        - name: analytics-service
          image: muskanyadav1/taskmanager-analytics:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8086
          env:
            - name: TASK_SERVICE_URL
              value: http://task-service:8085/tasks
